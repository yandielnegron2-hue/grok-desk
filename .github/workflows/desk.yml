name: desk
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
  push: {branches: [main], paths: ["engine/**", "test/**", "package*.json"]}
permissions: {contents: write}
concurrency: {group: desk, cancel-in-progress: false}
jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: tests (a failing breaker/gate test stops the desk)
        run: npm test
      - name: cycle
        if: github.event_name != 'push'
        env:
          MODE: ${{ vars.MODE }}
          KILL: ${{ vars.KILL }}
          RPC_URL: ${{ secrets.RPC_URL }}
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
        run: node engine/cycle.js
      - if: github.event_name != 'push'
        run: |
          git config user.name grok-desk; git config user.email grok-desk@users.noreply.github.com
          git add data && (git diff --cached --quiet || (git commit -qm "cycle $(date -u +%FT%TZ)" && git pull -q --rebase && git push -q))
