<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grok Desk (failure-mode engineered memecoin desk)</title>
<style>html,body{margin:0;background:#050806;color:#E8F2EA;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{padding:12px}a{color:inherit}
.app{background:#050806;padding:16px;border-radius:20px;max-width:560px;margin:0 auto;font-size:14px}
.card{background:#0E1511;border:1px solid #1C2A21;border-radius:18px;padding:16px;margin-bottom:14px}
.inner{background:#050806;border:1px solid #1C2A21;border-radius:14px;padding:12px;margin-bottom:10px}
.pill{border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;display:inline-block}
.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}.wrap{display:flex;flex-wrap:wrap;gap:8px}
.t{font-size:20px;font-weight:700;margin-bottom:8px}.mu{color:#7E8F84}.g{color:#39FF6A}.r{color:#FF4D5E}.a{color:#FFB020}.b{color:#4DA3FF}.p{color:#B57BFF}
.line{padding:6px 0;border-top:1px solid #1C2A21}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.scroll{max-height:220px;overflow-y:auto;font-size:12px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:4px;border-top:1px solid #1C2A21;text-align:right}td:first-child,th:first-child{text-align:left}th{color:#7E8F84;font-weight:500}
input{background:#050806;color:#E8F2EA;border:1px solid #1C2A21;border-radius:8px;padding:6px;width:90px}button{background:#1C2A21;color:#39FF6A;border:0;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px}
.sq{width:12px;height:12px;border-radius:4px;display:inline-block;margin-right:8px;vertical-align:middle}.bar{height:4px;background:#1C2A21;border-radius:3px}.bar div{height:4px;background:#FF4D5E;border-radius:3px}
</style></head><body><div class="app" id="app">Loading desk…</div>
<script>
const G="#39FF6A",R="#FF4D5E",A="#FFB020",B="#4DA3FF",P="#B57BFF",M="#7E8F84";
const pill=(c,t,x="")=>`<span class="pill" style="color:${c};background:${c}22;${x}">${t}</span>`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ET=d=>d?new Date(d).toLocaleString("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit",month:"short",day:"numeric"})+" ET":"—";
const fm=n=>n==null?"—":n>=1e6?"$"+(n/1e6).toFixed(2)+"M":n>=1e3?"$"+(n/1e3).toFixed(1)+"K":"$"+(+n).toFixed(0);
const pc=n=>n==null||!isFinite(n)?"—":(n>=0?"+":"")+n.toFixed(1)+"%";
const short=w=>w?w.slice(0,4)+"…"+w.slice(-4):"—";
let D=null,px={},pxAt=null,house={feeRate:.01,vol:0,cost:5};
async function load(){try{D=await(await fetch("data/desk.json?t="+Date.now())).json();}catch(e){document.getElementById("app").textContent="data/desk.json not available yet";return;}
 if(house.vol===0&&D.config){house={feeRate:D.config.house.feeRate,vol:D.config.house.expectedVolumePerTokenUsd,cost:D.config.house.costPerLaunchUsd};}await prices();}
async function prices(){const cas=[...new Set([...(D.positions||[]).map(p=>p.mint),...(D.calls||[]).filter(c=>c.ca).map(c=>c.ca)])].slice(0,30);
 try{const d=await(await fetch("https://api.dexscreener.com/latest/dex/tokens/"+cas.join(","))).json();const n={};for(const p of d.pairs||[]){const a=p.baseToken.address,l=p.liquidity?.usd??null;if(!n[a]||(l||0)>(n[a].liq||0))n[a]={sym:p.baseToken.symbol,mc:p.marketCap??p.fdv,liq:l,h1:p.priceChange?.h1,price:+p.priceUsd,url:p.url};}px=n;pxAt=new Date();}catch(e){}
 render();}
function spark(h){if(!h||h.length<2)return"";const v=h.map(x=>x.b),mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;return`<svg viewBox="0 0 300 60" width="100%" style="margin-top:10px"><polyline points="${v.map((y,i)=>`${i/(v.length-1)*300},${55-(y-mn)/r*50}`).join(" ")}" fill="none" stroke="${G}" stroke-width="2"/></svg>`;}
function render(){const d=D,live=d.mode==="LIVE",bk=d.book,start=live?(d.dayStartBook||bk):d.paperStart,pnl=bk-(d.dayStartBook||bk);
 const posLive=d.positions.map(p=>{const q=px[p.mint];const v=q&&q.price&&p.entryPrice?p.sol*q.price/p.entryPrice:p.value;return{...p,v};});
 const br=d.breakers,brs=[["Daily loss cap",br.dailyLoss,`-${d.config.desk.dailyLossCapPct}% day`],["Consecutive losses",br.consecutiveLosses,`${d.consecutiveLosses}/${d.config.desk.maxConsecutiveLosses}`],["Liquidity drop",false,`exit at -${d.config.desk.liquidityDropExitPct}% liq`],["Feed lag",br.feedLag,`${d.feedLagSec??"—"}s / ${d.config.desk.feedLagMaxSec}s`],["KILL switch",br.kill,d.kill?"ON":"off"]];
 const h=new (function(){})();let o="";
 o+=`<div class="row"><div><div style="font-size:26px;font-weight:800">Grok Desk</div><div class="mu">${d.order.length} bots · fix order ${d.order.join(" › ")}</div></div>${pill(live?R:A,live?"LIVE · real SOL":"PAPER")}</div>`;
 o+=`<div style="background:${live?R:A};color:#000;border-radius:12px;padding:10px;margin:12px 0;font-weight:800;text-align:center">${live?"LIVE MODE · trading real SOL from the desk wallet":"PAPER MODE · simulated trades, no real SOL moves"}${d.kill?" · KILL ON":""}</div>`;
 const tk=Object.values(px).filter(x=>x.h1!=null).slice(0,8);if(tk.length)o+=`<div class="wrap" style="margin:10px 0">${tk.map(x=>`<span>$${esc(x.sym)} ${pill(x.h1>=0?G:R,pc(x.h1))}</span>`).join("")}</div>`;
 o+=`<div class="card"><div class="row"><span class="mu">${live?"Wallet book":"Paper book (simulated)"}</span>${pill(G,(bk/start).toFixed(2)+"x",`font-size:18px;background:${G};color:#000`)}</div>
 <div style="font-size:56px;font-weight:800">◎${Math.floor(bk)}<span style="font-size:26px;color:${M}">.${(bk%1).toFixed(4).slice(2)}</span></div>
 <div class="row"><span style="color:${pnl>=0?G:R};font-weight:700">${pnl>=0?"+":""}${pnl.toFixed(4)} SOL today (${pc(d.dayStartBook?pnl/d.dayStartBook*100:0)})</span>${pill(A,"loss streak "+d.consecutiveLosses)}</div>
 <div class="mu" style="font-size:12px;margin-top:6px">Wallet <a href="https://solscan.io/account/${d.wallet}" target="_blank">${short(d.wallet)}</a> · on-chain ${d.walletSol==null?"unavailable":d.walletSol.toFixed(4)+" SOL"} <button onclick="navigator.clipboard.writeText('${d.wallet}');this.textContent='Copied'">Copy</button><br>Last cycle ${ET(d.updated)} · prices ${pxAt?pxAt.toLocaleTimeString("en-US",{timeZone:"America/New_York"})+" ET (live, 30s)":"loading"}</div>${spark(d.hist)}</div>`;
 o+=`<div class="card"><div class="t">Desk circuit breakers</div>${brs.map(([n,on,x])=>`<div class="row line"><span>${n} <span class="mu" style="font-size:12px">${x}</span></span>${pill(on?R:G,on?"TRIPPED":"armed")}</div>`).join("")}<div class="mu" style="font-size:12px;margin-top:6px">${br.blockEntries?"New entries blocked. Exits still run.":"Entries allowed."} Each breaker has a test that fails the build.</div></div>`;
 for(const k of d.order){const f=d.fmea[k];o+=`<div class="card"><div class="row"><div class="t" style="text-transform:capitalize">${k} · failure mode sheet</div>${pill(k==="house"?M:G,k==="house"?"launching disabled":"active")}</div>
 <div class="inner">${[["Edge",f.edge],["Blast radius",f.blastRadius],["Safety factor",f.safetyFactor],["Hard rule",f.hardRule]].map(([a,b])=>`<div class="row" style="padding:3px 0;font-size:13px"><span class="mu">${a}</span><span style="text-align:right;max-width:70%">${esc(b)}</span></div>`).join("")}</div>
 <table><tr><th>Failure (worst first)</th><th>S</th><th>L</th><th>D</th><th>RPN</th></tr>${f.failures.map(x=>`<tr><td>${esc(x.mode)}<div class="mu" style="font-size:11px">${esc(x.fix)}</div></td><td>${x.S}</td><td>${x.L}</td><td>${x.D}</td><td style="color:${x.RPN>=200?R:x.RPN>=100?A:G};font-weight:700">${x.RPN}</td></tr>`).join("")}</table>
 <div style="margin-top:8px;font-size:12px">${Object.entries(f.live||{}).map(([a,b])=>`<div class="line"><span class="mu">${esc(a)}</span> · ${esc(b)}</div>`).join("")}</div>`;
 if(k==="gambler")o+=`<div class="inner" style="margin-top:10px"><b>Sizing: same 3 signals on $1,000</b><table><tr><th></th><th>size off last result</th><th>fixed 2% of book</th></tr><tr><td>T1 +50%</td><td>5% $50 → $1,025</td><td>$20 → $1,010</td></tr><tr><td>T2 +50%</td><td>10% $103 → $1,076</td><td>$20 → $1,020</td></tr><tr><td>T3 rug −90%</td><td class="r">20% $215 → $883</td><td class="g">$20 → $1,002</td></tr></table><div class="mu" style="font-size:12px">Desk uses the right column only (test-enforced).</div></div>`;
 if(k==="spy")o+=`<div class="inner" style="margin-top:10px"><b>Latency: same wallet, same exit</b><table><tr><th></th><th>leader</th><th>you (+60% chase)</th></tr><tr><td>entry</td><td>$0.0010</td><td>$0.0016</td></tr><tr><td>exit 2.0x</td><td class="g">+100%</td><td class="g">+25%</td></tr><tr><td>exit 1.4x</td><td class="g">+40%</td><td class="r">−12.5%</td></tr></table><div class="mu" style="font-size:12px">Rule: fill > leader +15% ⇒ skip, log wallet + lag.</div></div>
 <div style="font-weight:700;margin:10px 0 6px">Copy list</div>${d.spy.map(w=>`<div class="line"><div class="row"><b>${esc(w.name)}</b>${pill(w.demoted?R:w.losses?A:M,w.demoted?"demoted":w.losses?w.losses+" losses":"no copies yet")}</div><div class="row"><span class="mono" style="font-size:11px;word-break:break-all;color:${M}">${w.w}</span><a href="https://solscan.io/account/${w.w}" target="_blank" class="b" style="font-size:12px">solscan</a></div></div>`).join("")}`;
 if(k==="house"){const fee=house.feeRate*house.vol,req=2*house.cost,ok=fee>=req;o+=`<div class="inner" style="margin-top:10px"><b>Break-even calculator</b><div class="wrap" style="margin:8px 0;font-size:12px"><label>fee rate <input id="hf" type="number" step="0.001" value="${house.feeRate}"></label><label>volume/token $ <input id="hv" type="number" value="${house.vol}"></label><label>cost/launch $ <input id="hc" type="number" value="${house.cost}"></label></div>
 <div>fee × volume = <b>$${fee.toFixed(2)}</b> vs 2 × cost = <b>$${req.toFixed(2)}</b> ${pill(ok?G:R,ok?"clears":"fails")}</div><div class="mu" style="font-size:12px;margin-top:6px">Launch budget is 0: the desk never launches, holds, or sells its own supply. Calculator is local only.</div></div>`;}
 o+=`</div>`;}
 o+=`<div class="card"><div class="t">Open positions</div>${posLive.length?posLive.map(p=>`<div class="row line"><span>$${esc(p.sym)} <span class="mu" style="font-size:12px">${esc(p.src)}</span></span><span style="color:${p.v>=p.sol?G:R}">${p.sol.toFixed(4)} → ${p.v.toFixed(4)} SOL (${pc((p.v/p.sol-1)*100)})</span></div>`).join(""):`<div class="mu">No open positions.</div>`}
 <div style="font-weight:700;margin:10px 0 4px">Profits banked</div><div class="scroll mono">${d.closed.length?d.closed.map(c=>`<div><span class="mu">${ET(c.t2)}</span> $${esc(c.sym)} ${esc(c.exit)} <span style="color:${c.out>=c.sol?G:R}">${(c.out-c.sol>=0?"+":"")+(c.out-c.sol).toFixed(4)} SOL</span></div>`).join(""):`<span class="mu">no closed ${live?"":"paper "}trades yet</span>`}</div></div>`;
 const c=d.config;o+=`<div class="card"><div class="t">${live?"Live":"Paper"} trade settings</div>${[["Position size",`${c.gambler.bookFraction*100}% of current book`],["Max open",c.gambler.maxOpen],["Take profit",`+${c.gambler.takeProfitPct}%`],["Stop loss",`${c.gambler.stopLossPct}%`],["Slippage",`${c.desk.slippageBps/100}%`],["SOL reserve",`${c.desk.solReserve} SOL for fees`],["Min liquidity",fm(c.gambler.minLiquidityUsd)],["Max top-10",`${c.gambler.maxTop10Pct}%`],["Max call age",`${c.gambler.maxCallAgeSec/60} min`],["RPC",d.rpcCustom?"custom (RPC_URL)":"public (rate-limited; add RPC_URL secret)"]].map(([a,b])=>`<div class="row" style="padding:3px 0;font-size:13px"><span class="mu">${a}</span><span>${b}</span></div>`).join("")}</div>`;
 const fn=d.funnel,fw=[["Scout","signals seen",B,fn.scout+" signals"],["Filter","gates rejected",A,fn.filter+" killed"],["Copied","entries",G,fn.copied+" entered"],["Stops","SL + liq drop",P,fn.stops+" stops"],["TP","take-profit",G,fn.tp+" hits"]];
 o+=`<div class="card"><div class="row"><div class="t">Copy funnel</div><span class="g">${fn.copied} entered</span></div>${fw.map(([n,x,col,v])=>`<div class="row line"><span><span class="sq" style="background:${col}"></span>${n} <span class="mu">${x}</span></span>${pill(col,v)}</div>`).join("")}</div>`;
 const ks=Object.entries(d.kills).sort((a,b)=>b[1]-a[1]).slice(0,8),km=Math.max(1,...ks.map(x=>x[1]));if(ks.length)o+=`<div class="card"><div class="t">Why coins got killed</div>${ks.map(([n,v])=>`<div style="margin-bottom:6px"><div class="row"><span>${esc(n)}</span><span class="r">${v}</span></div><div class="bar"><div style="width:${v/km*100}%"></div></div></div>`).join("")}</div>`;
 const sc=s=>/BUY|TP/.test(s)?G:/KILL|STOP|ERROR|BREAKER|LIQ/.test(s)?R:/SKIP|MIRROR/.test(s)?A:M;
 o+=`<div class="card"><div class="t">Activity</div><div class="scroll">${d.log.map(l=>`<div style="margin-bottom:4px"><span class="mu">${ET(l.t)}</span> <span style="color:${sc(l.stage)}">${esc(l.stage)}</span> ${esc(l.msg)} ${l.src?pill(B,esc(l.src),"font-size:11px"):""}</div>`).join("")||'<span class="mu">no activity yet</span>'}</div></div>`;
 o+=`<div class="card"><div class="t">Callouts</div><div class="mu" style="font-size:12px;margin-bottom:8px">Real Telegram posts, scraped each cycle; MC live from DexScreener.</div><div class="scroll" style="max-height:360px">${d.calls.map(c=>{const q=c.ca&&px[c.ca];return`<a href="${esc(c.link)}" target="_blank" style="display:block;text-decoration:none" class="line">${pill(c.channel==="SmugCalls"?B:c.channel==="bitconggems"?P:G,"TG")} <b>${esc(c.channel)}</b> <span class="mu">${ET(c.time)}</span>${q?` · now ${fm(q.mc)} ${pill(q.h1>=0?G:R,"1h "+pc(q.h1),"font-size:11px")}`:""}<div style="color:#C9D6CC;margin-top:2px">${esc(c.text)}</div></a>`}).join("")}</div></div>`;
 o+=`<div class="card"><div class="t">Sources</div><div class="wrap">${["PumpPillSignals","SmugCalls","bitconggems"].map(c=>`<a href="https://t.me/${c}" target="_blank" style="text-decoration:none">${pill(P,c)}</a>`).join("")}<a href="https://dexscreener.com" target="_blank" style="text-decoration:none">${pill(G,"DexScreener")}</a>${pill(M,"Jupiter swaps")}</div></div>`;
 o+=`<div class="mu" style="font-size:12px;text-align:center">Not financial advice. Rules cap damage; they don't remove it. Fund the desk wallet only with what you can lose. Never share a seed phrase.</div>`;
 document.getElementById("app").innerHTML=o;
 for(const [id,k] of [["hf","feeRate"],["hv","vol"],["hc","cost"]]){const e=document.getElementById(id);if(e)e.onchange=()=>{house[k]=+e.value;render();};}}
load();setInterval(prices,30000);setInterval(load,120000);
</script></body></html>
